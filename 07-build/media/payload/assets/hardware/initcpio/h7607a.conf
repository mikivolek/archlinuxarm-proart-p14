# The installed profile uses mkinitcpio's udev/BusyBox initrd. Initial
# pacstrap may run an ALPM image hook before archinstall writes its native
# storage configuration, while the base package still has systemd defaults.
# Convert only the ordinary unencrypted default; encrypted systemd profiles
# require their own incompatible boot contract and are rejected.
case " ${HOOKS[*]} " in
    *" sd-encrypt "*|*" sd-lvm2 "*|*" sd-plymouth "*)
        error 'H7607BA profile requires native BusyBox storage hooks'; return 1 ;;
esac
case " ${HOOKS[*]} " in
    *" systemd "*)
        _h7607a_hooks=()
        for _h7607a_hook in "${HOOKS[@]}"; do
            case "$_h7607a_hook" in
                systemd) _h7607a_hooks+=(udev) ;;
                sd-vconsole) _h7607a_hooks+=(keymap consolefont) ;;
                sd-*) error 'Unknown systemd initramfs hook'; return 1 ;;
                *) _h7607a_hooks+=("$_h7607a_hook") ;;
            esac
        done
        HOOKS=("${_h7607a_hooks[@]}")
        unset _h7607a_hooks _h7607a_hook
        ;;
esac
# Preserve native encrypt/lvm2/btrfs hooks and module ordering.
MODULES+=(hid_asus nvme xhci_pci xhci_plat_hcd xhci_mtk_hcd usb_storage uas i2c_mt65xx i2c_hid_acpi usbhid hid_generic hid_multitouch nvidia nvidia_modeset nvidia_uvm nvidia_drm)
MODULES_DECOMPRESS=no
case " ${HOOKS[*]} " in
    *" h7607a-preload "*) ;;
    *) HOOKS=(h7607a-preload "${HOOKS[@]}") ;;
esac
