# Normal desktop WirePlumber policy: retain main's session, state, D-Bus,
# reservation and logind integration. Package user units own the services.
wireplumber.profiles = {
  main = {
    hardware.video-capture = disabled
    monitor.v4l2 = disabled
    monitor.libcamera = disabled
    monitor.alsa-midi = disabled
    monitor.bluez-midi = disabled
  }
}

wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}

monitor.alsa.rules = [
  {
    matches = [
      { api.alsa.card.name = "~mt8901.*" }
      { device.name = "~alsa_card.platform-mt8901.*" }
    ]
    actions = { update-props = {
      api.alsa.use-ucm = true
      api.alsa.soft-mixer = true
    } }
  }
]

# These are LOCAL Bluetooth roles: source encodes/transmits to headphones.
# Keep A2DP and LE Audio playback; omit HFP/HSP microphone/telephony roles.
# PipeWire 1.6.9 spa/plugins/bluez5/bluez5-dbus.c get_codec_profile() and
# codec_has_direction() define this direction (source -> codec->encode).
monitor.bluez.properties = {
  override.bluez5.roles = [ a2dp_source bap_source ]
  # Explicit non-duplex codecs: some A2DP codecs include microphone return
  # channels even without HFP. PipeWire 1.6.9's declarations for these codecs
  # have no duplex_codec. WirePlumber 0.5.18 BlueZ ignores node.disabled, so
  # disabling an input node by that property would not enforce this policy.
  override.bluez5.codecs = [
    sbc sbc_xq aac ldac aptx aptx_hd aptx_ll faststream
    lc3plus_hr opus_05 opus_05_51 opus_05_71 lc3
  ]
  bluez5.hfphsp-backend = "none"
}
