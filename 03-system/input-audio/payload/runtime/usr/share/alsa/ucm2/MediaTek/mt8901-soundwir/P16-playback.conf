# ASUS H7607BA/H7407BA adaptation of NVIDIA MT8901 UCM (CS42L43 + 2x CS35L56).
# Requires the installed machine driver and board-specific CS35L56
# firmware/calibration. CS42L43 drives the headphone output and both
# microphones. Speaker PCM0; headphone PCM1; internal DMIC and headset mic
# share capture PCM8 (UL1) as conflicting devices.

SectionVerb {
    EnableSequence [
        cset "name='AMP1 Speaker Switch' 0"
        cset "name='AMP2 Speaker Switch' 0"
        cset "name='Speaker Switch' 0"
        cset "name='Headphone Switch' 0"
        cset "name='O152 I032 Switch' 1"
        cset "name='O153 I033 Switch' 1"
        cset "name='PDI3 Demux' DP3"
        cset "name='O156 I034 Switch' 1"
        cset "name='O157 I035 Switch' 1"
        cset "name='PDI5 Demux' DP5"
        cset "name='PDI6 Demux' DP6"
        cset "name='cs42l43 Headphone L Input 1' DP5RX1"
        cset "name='cs42l43 Headphone R Input 1' DP5RX2"
        # capture: UL1 <- O020/O021 <- PDI13 <- host DP7
        cset "name='PDI13 Mux' DP7"
        cset "name='O020 I180 Switch' 1"
        cset "name='O021 I181 Switch' 1"
    ]
    DisableSequence [
        cset "name='AMP1 Speaker Switch' 0"
        cset "name='AMP2 Speaker Switch' 0"
        cset "name='Speaker Switch' 0"
        cset "name='Headphone Switch' 0"
    ]
    Value { TQ "HiFi" }
}

SectionDevice."Speaker" {
    Comment "Internal speakers"
    EnableSequence [
        cset "name='Speaker Switch' 1"
        cset "name='AMP1 Speaker Switch' 1"
        cset "name='AMP2 Speaker Switch' 1"
    ]
    DisableSequence [
        cset "name='AMP1 Speaker Switch' 0"
        cset "name='AMP2 Speaker Switch' 0"
        cset "name='Speaker Switch' 0"
    ]
    Value {
        PlaybackPriority 100
        PlaybackPCM "hw:${CardId},0"
        PlaybackChannels 2
    }
}

SectionDevice."Headphones" {
    Comment "Wired headphones"
    EnableSequence [
        cset "name='Headphone Switch' 1"
        cset "name='cs42l43 Headphone Digital Volume' 229,229"
    ]
    DisableSequence [ cset "name='Headphone Switch' 0" ]
    Value {
        PlaybackPriority 200
        PlaybackPCM "hw:${CardId},1"
        PlaybackChannels 2
        JackControl "Headphone Jack"
        JackHWMute "Speaker"
    }
}

SectionDevice."Mic" {
    Comment "Internal microphone array"
    ConflictingDevice [
        "Headset"
    ]
    EnableSequence [
        cset "name='cs42l43 DP1TX1 Input' 'Decimator 3'"
        cset "name='cs42l43 DP1TX2 Input' 'Decimator 4'"
        cset "name='cs42l43 Decimator 3 Switch' 1"
        cset "name='cs42l43 Decimator 4 Switch' 1"
        cset "name='cs42l43 Decimator 3 Volume' 176"
        cset "name='cs42l43 Decimator 4 Volume' 176"
    ]
    DisableSequence [
        cset "name='cs42l43 Decimator 3 Switch' 0"
        cset "name='cs42l43 Decimator 4 Switch' 0"
        # hand the shared DP1TX inputs to the Headset device: PipeWire ACP
        # may run this disable after the other device's enable
        cset "name='cs42l43 DP1TX1 Input' 'Decimator 1'"
        cset "name='cs42l43 DP1TX2 Input' 'Decimator 1'"
    ]
    Value {
        CapturePriority 100
        CapturePCM "hw:${CardId},8"
        CaptureChannels 2
    }
}

SectionDevice."Headset" {
    Comment "Headset microphone"
    ConflictingDevice [
        "Mic"
    ]
    EnableSequence [
        cset "name='Headset Mic Switch' 1"
        cset "name='cs42l43 Decimator 1 Mode' ADC"
        cset "name='cs42l43 DP1TX1 Input' 'Decimator 1'"
        cset "name='cs42l43 DP1TX2 Input' 'Decimator 1'"
        cset "name='cs42l43 Decimator 1 Switch' 1"
    ]
    DisableSequence [
        cset "name='cs42l43 Decimator 1 Switch' 0"
        cset "name='Headset Mic Switch' 0"
        # hand the shared DP1TX inputs to the Mic device (see above)
        cset "name='cs42l43 DP1TX1 Input' 'Decimator 3'"
        cset "name='cs42l43 DP1TX2 Input' 'Decimator 4'"
    ]
    Value {
        CapturePriority 200
        CapturePCM "hw:${CardId},8"
        CaptureChannels 2
        JackControl "Headset Mic Jack"
    }
}
