      "source_inputs": [
        {
          "file": "acpica-unix-20260408.tar.gz",
          "sha256": "e66ceb26d6d514ce164fe22f5a4f7ca165cc38349d7a97f41a21f19b364647a2",
          "url": "https://github.com/acpica/acpica/releases/download/20260408/acpica-unix-20260408.tar.gz"
        }
      ],
      "inputs": [
        "provenance/hardware/power-source.sed",
        "provenance/hardware/power-splice.json",
        "provenance/hardware/power-method-changes.json"
      ],
      "output": "assets/hardware/acpi/h7607a-acpi.cpio",
      "notes": [
        "Enable NVDA8400 SSPM without a global OSI override.",
        "Repair buffer lifetime in RRA9/RRA8/WRA9/WRA8/RWEC/GBST only.",
        "Apply early ACPI archive in RAM; do not flash firmware.",
        "power-archive-builder.py --dump DIR copies the H7607BA.300 DSDT and ASUS SSDT from the owner's dump to the two baseline paths, derives power-source.dsl with iasl -d and power-source.sed, and writes the archive, each once its pinned hash matches.",
        "The firmware tables, power-source.dsl and the archive are not stored in this repository. Redistribution permission is not asserted."
      ]
    },
    {
      "id": "acpi-table-dump-kit",
      "type": "custom",
      "repo_url": null,
      "checkout_hash": null,
      "sparse": {
        "enabled": false,
        "paths": []
      },
      "code": "scripts/stage-acpi-dump.py",
      "dependencies": [
        {
          "name": "python",
          "version": "3.14.8-1",
          "version_status": "pinned",
          "source": "locks/live-tools.json"
        }
      ],
      "inputs": [
        "assets/hardware/uefi/Shell.efi",
        "assets/hardware/uefi/acpi-dump.nsh"
      ],
      "notes": [
        "Copy the media component's pinned EDK2 Shell to EFI/BOOT/BOOTAA64.EFI and acpi-dump.nsh to EFI/BOOT/startup.nsh on a mounted FAT32 stick; nothing is partitioned or formatted.",
        "Booting the stick runs acpiview -s DSDT -d and acpiview -s SSDT -d in its H7607A-ACPI folder after removing old dumps, because acpiview does not truncate existing files."
      ]
    }
  ],
